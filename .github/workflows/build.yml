name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./...
      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...
      - name: Test
        env:
          CGO_ENABLED: 0
        run: go test -count=1 ./...
      - name: Build gameops binary
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o gameops ./cmd/gameops
      - name: Smoke
        shell: bash
        run: |
          ./gameops version
          ./gameops numcalc '1/3 + 2/7'
          ./gameops opsreport examples/gacha.json | head -3
